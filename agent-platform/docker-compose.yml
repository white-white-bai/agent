services:
  api:
    build: .
    image: agent-platform:dev
    env_file: .env
    ports:
      - "8900:8900"
    depends_on:
      - langfuse

  # 长任务 worker（Redis 队列消费：知识入库 / 工作流批处理 / 报告生成）
  worker:
    build: .
    image: agent-platform:dev
    env_file: .env
    command: ["python", "-m", "agent_platform.worker.main"]
    depends_on:
      - langfuse

  # Langfuse 自托管（节点级 trace / 汇总看板）
  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: change-me
      SALT: change-me
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - langfuse-db

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data

volumes:
  langfuse_pgdata:
