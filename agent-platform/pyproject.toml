[project]
name = "agent-platform"
version = "0.1.0"
description = "agent 中台：基于 LangChain/LangGraph 的图编排引擎与统一管理平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "redis>=5.0",
    "httpx>=0.26",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "langchain-core>=0.2",
    "langgraph>=0.1",
    "langchain-openai>=0.1",
    # 知识库文件解析（PDF / DOCX / XLSX / XLS）
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/agent_platform/engine/code_sandbox.py" = ["S102"]
